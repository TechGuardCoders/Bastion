[package]
name = "bastion"
version = "1.0.0"
edition = "2021"
description = "Bastion - secure multi-tenant inference layer (Rust implementation)"

[lib]
name = "bastion"
path = "src/lib.rs"

[[bin]]
name = "bastion"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
opt-level = 2
