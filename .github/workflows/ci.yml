name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: smoke — bastion boots, audit chain verifies
        run: |
          python -m uvicorn bastion:app --port 3200 &
          sleep 4
          curl -s http://localhost:3200/health | grep -o '"audit_ok":true'
